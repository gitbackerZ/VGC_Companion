name: pokemon_mb_companion
description: A text-only accessibility-friendly VGC companion app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_js: ^0.8.0
  http: ^1.2.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/data/
    - assets/engine.js
    - assets/js/dex.js
    - assets/js/learnsets.json
